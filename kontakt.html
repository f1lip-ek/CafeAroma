<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt Cafe Aroma</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="photos/favicon.ico" />
    <meta name="description" content="Café Aroma - nejlepší káva ve městě.">
</head>
<body>
    <header>
        <div>
            <ul class="navigation">
                <li><a class="logo" href="./index.html">Cafe Aroma</a></li>
                <li><a href="./menu.html">Jidelni listek</a></li>
                <li><a href="./galerie.html">Galerie</a></li>
                <li><a href="./kontakt.html">Kontakt</a></li>
            </ul>
        </div>
    </header>

    <main>
        <div>
            <h1 class="centered">Kontaktni formular</h1>
            <form>
                <div class="jmeno centered">
                    <label for="jmeno">Vase jmeno:</label>
                    <input class="contact" type="text" id="jmeno" name="jmeno" required placeholder="Karel Novak"/>
                    <br>
                </div>
                <div class="email centered">
                    <label for="email">Vas email:</label>
                    <input class="contact" type="email" id="email" name="email" required placeholder="email@domena.cz"/>
                    <br>
                </div>
                <div class="predmet centered">
                    <label for="predmet_zpravy">Predmet zpravy:</label>
                    <input class="contact" type="text" id="predmet_zpravy" name="predmet_zpravy" placeholder="Predmet zpravy"/>
                    <br>
                </div>
                <div class="zprava centered">
                    <label for="zprava">Zprava:</label>
                    <textarea class="contact"  id="zprava" name="zprava" rows="4" cols="50" placeholder="Zde napiste zpravu..."></textarea>
                    <br>
                </div>
                <div class="odeslat centered">
                    <input class="contact" type="submit" id="odeslat" name="odeslat" value="Odeslat formular">
                </div>
            </form>
        </div>

    </main>
    <footer>
        <section id="contact">
            <a>Karel Novak</a>
            <a href="https://spsejecna.cz">Stranky SPSE Jecna</a>
        </section>
    </footer>
</body>
</html>
